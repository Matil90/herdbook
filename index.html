<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HerdBook">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>HerdBook</title>
<style>
:root{
  --bg:#f4f1ea;--surface:#fff;--surface2:#f8f6f1;--text:#1f2a1f;--muted:#667064;--line:#e3ded2;
  --brand:#2f6b3a;--brand-ink:#fff;--brand-soft:#e3efe2;
  --warn:#9a5b00;--warn-soft:#fbefd9;--danger:#b3261e;--danger-soft:#fbe4e2;
  --shadow:0 1px 2px rgba(30,40,30,.06),0 4px 14px rgba(30,40,30,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121612;--surface:#1b201b;--surface2:#222822;--text:#e8ece6;--muted:#9aa597;--line:#2e362e;
    --brand:#7cc48a;--brand-ink:#0d1a0f;--brand-soft:#1f3323;
    --warn:#f0b04a;--warn-soft:#3a2c14;--danger:#f2877f;--danger-soft:#3d1c1a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
[lang=ar] body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",sans-serif;line-height:1.55}
[dir=rtl] *{letter-spacing:0!important}
[dir=rtl] .flip{transform:scaleX(-1)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}
.shell{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.top h1{font-size:24px;letter-spacing:-.01em}
.top .grow{flex:1;min-width:0}
.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.icon-btn{border:0;background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.section{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.section a,.link{color:var(--brand);text-transform:none;letter-spacing:0;font-weight:600;font-size:14px;background:none;border:0;padding:0}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;border:0;text-align:start}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.alert .v{color:var(--danger)}
.stat.warn .v{color:var(--warn)}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start}
.row:last-child{border-bottom:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow>span b{display:inline}
.row small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:end;flex:none;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);flex:none;width:18px;height:18px}
.sp{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:22px;flex:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.center{justify-content:center}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{display:block;width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.stack{display:grid;gap:10px;margin-top:20px}
.fab{position:fixed;z-index:20;bottom:calc(80px + env(safe-area-inset-bottom));inset-inline-end:max(16px,calc(50vw - 224px));border:0;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:0 6px 20px rgba(20,60,30,.3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fab svg{width:20px;height:20px}
.nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:none;padding:9px 0 8px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600;min-width:0}
.nav button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.empty .big{font-size:36px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:14px}
.kv div small{display:block;color:var(--muted);font-size:12px}
.kv div span{font-weight:600}
.hero-animal{display:flex;gap:14px;align-items:center}
.hero-animal .sp{width:64px;height:64px;font-size:36px;border-radius:18px}
.hero-animal h2{font-size:20px}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
.chart{width:100%;height:auto;display:block;color:var(--brand);direction:ltr}
.chart text{fill:var(--muted);font-size:10px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mini div{background:var(--surface2);border-radius:12px;padding:10px;min-width:0}
.mini b{display:block;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{color:var(--muted);font-size:12px}
/* login */
.login{padding-top:calc(28px + env(safe-area-inset-top))}
.hero{text-align:center;margin:20px 0 24px}
.hero .logo{width:76px;height:76px;margin:0 auto 14px}
.hero h1{font-size:30px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:8px auto 0;max-width:320px}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(10,20,10,.45);animation:fade .15s}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{font-size:19px}
.sheet-head .icon-btn{box-shadow:none;background:var(--surface2)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{grid-column:span 2;display:grid;gap:5px;min-width:0}
.field.half{grid-column:span 1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:16px;min-height:44px}
.field textarea{min-height:76px;resize:vertical}
.field .invalid{border-color:var(--danger);background:var(--danger-soft)}
.req{color:var(--danger)}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet p.msg{margin:0 0 6px;color:var(--muted)}
/* age by teeth */
.tooth-list{display:grid;gap:8px}
.tooth-opt{display:flex;gap:12px;align-items:center;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);text-align:start}
.tooth-opt.on{border-color:var(--brand);background:var(--brand-soft)}
.tooth-opt b{display:block;font-weight:600}
.tooth-opt small{color:var(--muted)}
.tooth-svg{width:120px;height:auto;flex:none;direction:ltr}
.tooth-svg .gum{fill:#e3a49b}
.tooth-svg .milk{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.tooth-svg .perm{fill:#faf6ea;stroke:#8a8270;stroke-width:1.2}
.how{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);margin:0 0 12px}
.result{background:var(--brand-soft);border-radius:14px;padding:14px;margin-top:14px;text-align:center}
.result .v{font-size:24px;font-weight:700;color:var(--brand)}
.result small{display:block;color:var(--muted);margin-top:4px}
.ai-card{border:1.5px solid var(--brand);border-radius:16px;padding:12px;margin-bottom:16px;background:var(--surface)}
.ai-card .result{margin-top:10px}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ai-badge{background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.ai-tips{margin:4px 0 12px;padding-inline-start:20px;color:var(--muted);font-size:14px}
.ai-row{display:flex;gap:12px;align-items:flex-start}
.ai-photo{width:76px;height:76px;object-fit:cover;border-radius:12px;flex:none}
.ai-text{margin:6px 0;font-size:14px}
.ai-err{color:var(--danger);font-size:14px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;vertical-align:-3px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast[hidden]{display:none}
@keyframes up{from{transform:translate(-50%,40px)}}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<input id="teethPhotoFile" type="file" accept="image/*" hidden>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
'use strict';
/* ---------- constants ---------- */
const KEY = 'herdbook.v1';
const SPECIES = {Sheep:'🐑',Goat:'🐐',Cattle:'🐄'};
const MILK_SPECIES = ['Cattle','Goat','Sheep'];
const HEALTH_TYPES = ['Vaccination','Treatment','Deworming','Check-up','Injury','Pregnancy check','Other'];
const STATUSES = ['Active','Sold','Deceased'];
const AI_ENABLED = !!(typeof HB_CONFIG !== 'undefined' && HB_CONFIG.supabaseUrl && HB_CONFIG.supabaseKey);
const LOGO = '<svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2f6b3a"/><path d="M256 404V252" stroke="#f4f1ea" stroke-width="28" stroke-linecap="round"/><path d="M256 262c0-72 52-124 134-124 0 82-52 134-134 124z" fill="#f4f1ea"/><path d="M256 304c0-62-44-104-114-104 0 68 44 112 114 104z" fill="#cfe5c9"/></svg>';
const ICONS = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  animals:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  health:'<path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"/><path d="M12 10v5M9.5 12.5h5"/>',
  production:'<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
const CHEV = icon('chev', 'chev flip');

/* ---------- storage ---------- */
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return {farmers: [], currentId: null, data: {}};
}
let db = load();

/* ---------- language ---------- */
let lang = db.lang || (navigator.language || 'en').slice(0, 2);
if (!LANGS[lang]) lang = 'en';
// Arabic text with Western digits, so numbers match what farmers type into the forms.
const LOC = () => lang === 'ar' ? 'ar-u-nu-latn' : lang;
function t(k, v = {}) {
  const s = T[lang]?.[k] ?? T.en[k] ?? k;
  return s.replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
}
const tv = v => ENUM[lang]?.[v] ?? v;
const opts = list => list.map(x => [x, tv(x)]);
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL.includes(lang) ? 'rtl' : 'ltr';
}
function langChips(center) {
  return `<div class="chips${center ? ' center' : ''}">${Object.entries(LANGS).map(([k, n]) =>
    `<button class="chip ${lang === k ? 'on' : ''}" data-act="setLang" data-v="${k}" lang="${k}">${n}</button>`).join('')}</div>`;
}

/* ---------- utils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);
const sum = (arr, k) => arr.reduce((s, x) => s + (Number(x[k]) || 0), 0);
const fmt = (n, dp = 1) => Number(n || 0).toLocaleString(LOC(), {maximumFractionDigits: dp});
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function fdate(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00');
  const o = {day: 'numeric', month: 'short'};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(LOC(), o);
}
function age(b) {
  if (!b) return '';
  const now = new Date(today() + 'T00:00'), d = new Date(b + 'T00:00');
  let m = (now.getFullYear() - d.getFullYear()) * 12 + now.getMonth() - d.getMonth();
  if (now.getDate() < d.getDate()) m--;
  if (m < 1) return t('age_d', {n: Math.max(0, daysBetween(b, today()))});
  if (m < 24) return t('age_mo', {n: m});
  return t('age_y', {n: Math.floor(m / 12)}) + (m % 12 ? ' ' + t('age_mo', {n: m % 12}) : '');
}
function relDue(s) {
  const d = daysBetween(today(), s);
  if (d < 0) return {cls: 'danger', txt: t('rel_over', {n: -d})};
  if (d === 0) return {cls: 'warn', txt: t('rel_today')};
  return {cls: d <= 7 ? 'warn' : '', txt: t('rel_in', {n: d})};
}

function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast(t('couldNotSave')); } }
const me = () => db.farmers.find(f => f.id === db.currentId);
const D = () => db.data[db.currentId] || (db.data[db.currentId] = {animals: [], health: [], production: [], feed: []});
const animal = id => D().animals.find(a => a.id === id);
const aName = a => a ? (a.name || a.tag) : t('herdShort');
const aEmoji = a => a ? (SPECIES[a.species] || '🐾') : '🏡';
// "$12" for single symbols, "12 DA" / "12 €" / "12 دج" otherwise.
function money(n) {
  const c = (me()?.currency || '').trim();
  if (!c) return fmt(n, 2);
  return /^[$£¥]$/.test(c) ? c + fmt(n, 2) : fmt(n, 2) + ' ' + c;
}
const costLabel = () => t('f_cost') + (me().currency ? ` (${me().currency.trim()})` : '');
function dueList() {
  return D().health
    .filter(h => h.nextDue && !h.followDone && animal(h.animalId)?.status === 'Active')
    .sort((a, b) => a.nextDue.localeCompare(b.nextDue));
}

/* ---------- state & routing ---------- */
const state = {view: 'home', param: null, q: '', species: 'All', status: 'Active', prod: 'Milk'};
function go(v, p) { state.view = v; state.param = p || null; render(); window.scrollTo(0, 0); }

function render() {
  applyLang();
  const app = document.getElementById('app');
  if (!me()) { app.innerHTML = viewLogin(); return; }
  const v = state.view;
  const body = v === 'animals' ? viewAnimals()
    : v === 'animal' ? viewAnimal(state.param)
    : v === 'health' ? viewHealth()
    : v === 'production' ? viewProduction()
    : v === 'profile' ? viewProfile()
    : viewHome();
  app.innerHTML = `<div class="shell">${body}</div>${nav()}`;
  if (state.view === 'animals') renderAnimalList();
}

function nav() {
  const tabs = ['home', 'animals', 'health', 'production', 'profile'];
  const cur = state.view === 'animal' ? 'animals' : state.view;
  return `<nav class="nav">${tabs.map(k => `<button class="${cur === k ? 'on' : ''}" data-go="${k}">${icon(k)}<span>${t('nav_' + k)}</span></button>`).join('')}</nav>`;
}
function header(title, {back, right = ''} = {}) {
  return `<header class="top">${back ? `<button class="icon-btn" data-go="${back}" aria-label="${t('close')}">${icon('back', 'flip')}</button>` : ''}
    <div class="grow"><div class="eyebrow">${esc(me().farm)}</div><h1>${esc(title)}</h1></div>${right}</header>`;
}

/* ---------- views ---------- */
function viewLogin() {
  const list = db.farmers.map(f => `<button class="row" data-act="login" data-id="${f.id}">
      <span class="avatar">${esc(initials(f.name))}</span>
      <span class="grow"><b>${esc(f.name)}</b><small>${esc(f.farm)}${f.location ? ' · ' + esc(f.location) : ''}</small></span>
      ${CHEV}</button>`).join('');
  return `<div class="shell login">
    ${langChips(true)}
    <div class="hero"><div class="logo">${LOGO}</div><h1>HerdBook</h1><p>${t('appTag')}</p></div>
    ${db.farmers.length ? `<h2 class="section">${t('chooseAccount')}</h2><div class="list">${list}</div>` : ''}
    <div class="stack">
      <button class="btn primary block" data-act="register">${t('createAccount')}</button>
      <button class="btn block" data-act="demo">${t('exploreDemo')}</button>
    </div>
    <p class="note">${t('demoNote')}</p>
  </div>`;
}

function viewHome() {
  const d = D(), td = today();
  const active = d.animals.filter(a => a.status === 'Active');
  const due = dueList();
  const overdue = due.filter(h => h.nextDue < td).length;
  const soon = due.filter(h => h.nextDue >= td && daysBetween(td, h.nextDue) <= 14).length;
  const milk = sum(d.production.filter(p => p.kind === 'Milk' && p.date === td), 'qty');
  const counts = {};
  active.forEach(a => counts[a.species] = (counts[a.species] || 0) + 1);
  const hour = new Date().getHours();
  const greet = t(hour < 12 ? 'goodMorning' : hour < 18 ? 'goodAfternoon' : 'goodEvening');

  const byDate = (a, b) => b.date.localeCompare(a.date);
  const recent = [
    ...d.health.slice().sort(byDate).slice(0, 4).map(h => ({date: h.date, html: `${aEmoji(animal(h.animalId))} <b>${esc(tv(h.type))}</b>: ${esc(h.title)}`, sub: aName(animal(h.animalId))})),
    ...d.feed.slice().sort(byDate).slice(0, 2).map(f => ({date: f.date, html: `🌾 <b>${tv('Feed')}</b>: ${esc(f.feedType)}`, sub: `${fmt(f.qty)} ${t('u_kg')} · ${tv(f.group)}`})),
  ].sort(byDate);

  return `${header(t('greet', {g: greet, name: me().name.split(' ')[0]}))}
    <div class="stats">
      <button class="stat" data-go="animals"><div class="v">${fmt(active.length, 0)}</div><div class="l">${t('activeAnimals')}</div></button>
      <button class="stat ${overdue ? 'alert' : ''}" data-go="health"><div class="v">${fmt(overdue, 0)}</div><div class="l">${t('overdueTasks')}</div></button>
      <button class="stat ${soon ? 'warn' : ''}" data-go="health"><div class="v">${fmt(soon, 0)}</div><div class="l">${t('dueIn14')}</div></button>
      <button class="stat" data-act="openProd" data-k="Milk"><div class="v">${fmt(milk)} ${t('u_L')}</div><div class="l">${t('milkToday')}</div></button>
    </div>
    ${Object.keys(counts).length ? `<h2 class="section">${t('herd')}</h2><div class="chips">${Object.entries(counts).map(([s, n]) =>
      `<button class="chip" data-act="filterSpecies" data-v="${s}" data-nav="1">${SPECIES[s] || '🐾'} ${esc(tv(s))} · ${fmt(n, 0)}</button>`).join('')}</div>` : ''}
    <h2 class="section">${t('upcomingCare')} ${due.length > 5 ? `<button class="link" data-go="health">${t('seeAll')}</button>` : ''}</h2>
    ${due.length ? `<div class="list">${due.slice(0, 5).map(dueRow).join('')}</div>`
      : `<div class="list"><div class="empty"><div class="big">✅</div>${t('noUpcoming')}</div></div>`}
    <h2 class="section">${t('quickAdd')}</h2>
    <div class="btn-row">
      <button class="btn small" data-act="addAnimal">${t('addAnimalShort')}</button>
      <button class="btn small" data-act="addHealth">${t('addHealthShort')}</button>
      <button class="btn small" data-act="addProd" data-k="Milk">${t('addMilkShort')}</button>
      <button class="btn small" data-act="addProd" data-k="Feed">${t('addFeedShort')}</button>
      <button class="btn small" data-act="teeth">🦷 ${t('teethTool')}</button>
    </div>
    ${recent.length ? `<h2 class="section">${t('recentActivity')}</h2><div class="list">${recent.map(r =>
      `<div class="row"><span class="grow"><span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.html}</span><small>${esc(r.sub)}</small></span><span class="end muted">${fdate(r.date)}</span></div>`).join('')}</div>` : ''}`;
}

function renderAnimalList() {
  const el = document.getElementById('list'); if (!el) return;
  const q = state.q.trim().toLowerCase();
  const due = dueList();
  const items = D().animals.filter(a =>
      (state.species === 'All' || a.species === state.species) &&
      (state.status === 'All' || a.status === state.status) &&
      (!q || [a.tag, a.name, a.breed].some(x => String(x || '').toLowerCase().includes(q))))
    .sort((a, b) => a.tag.localeCompare(b.tag, undefined, {numeric: true}));
  if (!items.length) {
    el.innerHTML = `<div class="list"><div class="empty"><div class="big">🐾</div>${D().animals.length ? t('noMatch') : t('noAnimals')}</div></div>`;
    return;
  }
  el.innerHTML = `<div class="list">${items.map(a => {
    const next = due.find(h => h.animalId === a.id);
    const r = next && relDue(next.nextDue);
    const flag = r && r.cls ? `<span class="pill ${r.cls}">${r.cls === 'danger' ? t('overdue') : t('dueSoon')}</span>` : '';
    const st = a.status !== 'Active' ? `<span class="pill">${esc(tv(a.status))}</span>` : '';
    return `<button class="row" data-go="animal:${a.id}"><span class="sp">${aEmoji(a)}</span>
      <span class="grow"><b>${esc(a.name || a.tag)}</b><small><bdi>#${esc(a.tag)}</bdi>${a.breed ? ' · ' + esc(a.breed) : ''} · ${esc(tv(a.sex))}${a.birth ? ' · ' + (a.birthEst ? '≈' : '') + age(a.birth) : ''}</small></span>
      ${flag}${st}${CHEV}</button>`;
  }).join('')}</div><p class="note">${t('animalCount', {n: fmt(items.length, 0)})}</p>`;
}

function viewProduction() {
  const k = state.prod, d = D(), td = today();
  const entries = (k === 'Feed' ? d.feed : d.production.filter(p => p.kind === k)).slice().sort((a, b) => b.date.localeCompare(a.date));
  const unit = k === 'Milk' ? t('u_L') : t('u_kg');
  const days = [];
  for (let i = 13; i >= 0; i--) { const ds = addDays(td, -i); days.push({x: ds, y: entries.filter(e => e.date === ds).reduce((s, e) => s + (Number(e.qty) || 0), 0)}); }
  const last7 = days.slice(7).reduce((s, x) => s + x.y, 0);
  const prev7 = days.slice(0, 7).reduce((s, x) => s + x.y, 0);
  const change = prev7 ? Math.round((last7 - prev7) / prev7 * 100) : null;
  const u = unit ? ' ' + unit : '';
  const feedCost = k === 'Feed' ? sum(entries.filter(e => daysBetween(e.date, td) < 30), 'cost') : 0;
  return `${header(t('production'))}
    <div class="seg" style="margin-bottom:14px">${['Milk', 'Feed'].map(x =>
      `<button class="${k === x ? 'on' : ''}" data-act="prodTab" data-v="${x}">${x === 'Milk' ? '🥛' : '🌾'} ${tv(x)}</button>`).join('')}</div>
    <div class="card">
      <div class="mini">
        <div><b>${fmt(days[13].y)}${u}</b><small>${t('today')}</small></div>
        <div><b>${fmt(last7)}${u}</b><small>${t('last7')}</small></div>
        ${k === 'Feed' ? `<div><b>${money(feedCost)}</b><small>${t('cost30')}</small></div>`
          : `<div><b dir="ltr">${change === null ? '—' : (change >= 0 ? '+' : '') + fmt(change, 0) + '%'}</b><small>${t('vsPrior')}</small></div>`}
      </div>
      ${barChart(days, unit)}
    </div>
    <h2 class="section">${t('log_' + k)}</h2>
    ${entries.length ? `<div class="list">${entries.slice(0, 50).map(e => k === 'Feed'
      ? `<button class="row" data-act="editProd" data-k="Feed" data-id="${e.id}"><span class="sp">🌾</span><span class="grow"><b>${esc(e.feedType)}</b><small>${esc(tv(e.group))}${e.cost ? ' · ' + money(e.cost) : ''}${e.notes ? ' · ' + esc(e.notes) : ''}</small></span><span class="end"><b>${fmt(e.qty)}${u}</b><small class="muted">${fdate(e.date)}</small></span></button>`
      : `<button class="row" data-act="editProd" data-k="${k}" data-id="${e.id}"><span class="sp">${aEmoji(animal(e.animalId))}</span><span class="grow"><b>${esc(aName(animal(e.animalId)))}</b><small>${fdate(e.date)}${e.session ? ' · ' + esc(tv(e.session)) : ''}</small></span><span class="end"><b>${fmt(e.qty)}${u}</b></span></button>`
    ).join('')}</div>` : `<div class="list"><div class="empty">${t('noEntries')}</div></div>`}
    <button class="fab" data-act="addProd" data-k="${k}">${icon('plus')} ${t('logBtn_' + k)}</button>`;
}

/* ---------- charts ---------- */
function barChart(days, unit) {
  const W = 320, H = 130, pad = 18, max = Math.max(...days.map(d => d.y), 1);
  const bw = (W - pad) / days.length;
  const bars = days.map((d, i) => {
    const h = (d.y / max) * (H - 34);
    const x = pad + i * bw + 3, y = H - 18 - h;
    const day = new Date(d.x + 'T00:00').getDate();
    return `<rect x="${x}" y="${y}" width="${bw - 6}" height="${Math.max(h, d.y ? 2 : 0)}" rx="3" fill="currentColor" opacity="${i === days.length - 1 ? 1 : .55}"><title>${fdate(d.x)}: ${fmt(d.y)} ${unit}</title></rect>
      ${i % 2 === 1 ? `<text x="${x + (bw - 6) / 2}" y="${H - 4}" text-anchor="middle">${day}</text>` : ''}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('last14'))}">
    <line x1="${pad}" x2="${W}" y1="${H - 18}" y2="${H - 18}" stroke="var(--line)"/>
    <text x="0" y="12">${fmt(max)}</text>${bars}</svg>`;
}
function lineChart(pts, unit) {
  const W = 320, H = 110, pad = 8;
  const ys = pts.map(p => p.y), min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
  const t0 = new Date(pts[0].x).getTime(), t1 = new Date(pts[pts.length - 1].x).getTime(), ts = t1 - t0 || 1;
  const xy = pts.map(p => [pad + (new Date(p.x).getTime() - t0) / ts * (W - 2 * pad), pad + 14 + (1 - (p.y - min) / span) * (H - 2 * pad - 28)]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('weightTrend'))}">
    <polyline points="${xy.map(p => p.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    ${xy.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="currentColor"/>`).join('')}
    <text x="${pad}" y="12">${fmt(max)} ${unit}</text><text x="${pad}" y="${H - 2}">${fmt(min)} ${unit}</text></svg>`;
}

/* ---------- sheets & forms ---------- */
let sheetCtx = null;
function fieldHtml(f, v) {
  const val = v[f.name] ?? f.value ?? '';
  const req = f.required ? ' <span class="req">*</span>' : '';
  let input;
  if (f.type === 'select') {
    input = `<select name="${f.name}">${f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(ov)}"${String(ov) === String(val) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>`;
  } else {
    input = `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}"${f.type === 'number' ? ' inputmode="decimal" step="any" min="0"' : ''}${f.type === 'tel' ? ' dir="ltr"' : ''}>`;
  }
  return `<div class="field${f.half ? ' half' : ''}"><label>${esc(f.label)}${req}</label>${input}</div>`;
}
function openSheet(html) {
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="backdrop" data-act="closeSheet"></div>${html}`;
  s.hidden = false; document.body.classList.add('locked');
}
function closeSheet() {
  const s = document.getElementById('sheet');
  s.hidden = true; s.innerHTML = ''; sheetCtx = null; document.body.classList.remove('locked');
}
function openForm({title, fields, values = {}, submit = t('save'), onSubmit, onDelete}) {
  openSheet(`<form class="sheet" id="f" novalidate><div class="grab"></div>
    <div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-act="closeSheet" aria-label="${t('close')}">✕</button></div>
    <div class="fields">${fields.map(f => fieldHtml(f, values)).join('')}</div>
    <div class="sheet-actions">${onDelete ? `<button type="button" class="btn danger" data-act="sheetDelete">${t('delete')}</button>` : ''}
      <button class="btn primary grow" type="submit">${esc(submit)}</button></div></form>`);
  sheetCtx = {onDelete};
  const form = document.getElementById('f');
  form.addEventListener('submit', ev => {

/* ---------- age by teeth ---------- */
// Lower-jaw incisors. Each stage: [key, permanent teeth, wear (0 none, 1 worn, 2 broken), min age, max age (null = open)] in years.
// Typical ranges only; breed, feeding and region shift them.
const SHEEP_TEETH = {n: 8, stages: [['milk', 0, 0, 0, 1], ['p2', 2, 0, 1, 1.5], ['p4', 4, 0, 1.5, 2.5], ['p6', 6, 0, 2.5, 3], ['full', 8, 0, 3, 4], ['worn', 8, 1, 4, 6], ['broken', 8, 2, 6, null]]};
const TEETH = {
  Sheep: SHEEP_TEETH,
  Goat: SHEEP_TEETH,
  Cattle: {n: 8, stages: [['milk', 0, 0, 0, 2], ['p2', 2, 0, 1.5, 2.5], ['p4', 4, 0, 2.5, 3], ['p6', 6, 0, 3, 3.5], ['full', 8, 0, 3.5, 5], ['worn', 8, 1, 5, 9], ['broken', 8, 2, 9, null]]}
};
let teethCtx = null;

function toothSvg(n, perm, wear) {
  const step = 18, pad = 6, W = n * step + pad * 2, gumY = 44;
  const missing = wear === 2 ? [1, 6] : [];
  let teeth = '';
  for (let i = 0; i < n; i++) {
    const dist = Math.abs(i - (n - 1) / 2), x = pad + i * step;
    if (missing.includes(i)) continue;
    if (dist < perm / 2) { // permanent teeth replace milk teeth from the centre outward
      const h = wear === 0 ? 30 : wear === 1 ? 19 : 14;
      teeth += `<rect class="perm" x="${x + 1}" y="${gumY - h}" width="16" height="${h + 6}" rx="${wear ? 2 : 5}"/>`;
    } else {
      teeth += `<rect class="milk" x="${x + 4}" y="${gumY - 14}" width="10" height="18" rx="4"/>`;
    }
  }
  return `<svg class="tooth-svg" viewBox="0 0 ${W} 60" aria-hidden="true">${teeth}<rect class="gum" x="0" y="${gumY}" width="${W}" height="16" rx="8"/></svg>`;
}
function fmtYears(y) { return y < 1 ? t('age_mo', {n: Math.round(y * 12)}) : y === 1 ? t('year1') : t('years', {n: fmt(y, 1)}); }
function teethRange(min, max) {
  if (max === null) return t('moreThan', {a: fmtYears(min)});
  if (min === 0) return t('lessThan', {b: fmtYears(max)});
  return `${fmtYears(min)} – ${fmtYears(max)}`;
}
function teethLabel(key, perm) {
  if (key === 'milk') return t('teeth_milk');
  if (key === 'worn') return t('teeth_worn');
  if (key === 'broken') return t('teeth_broken');
  if (key === 'full') return t('teeth_full', {n: perm});
  return t('teeth_p', {n: perm});
}

        ${toothSvg(cfg.n, perm, wear)}
        <span class="grow"><b>${teethLabel(key, perm)}</b><small>≈ ${teethRange(min, max)}</small></span></button>`).join('')}</div>
    ${stage && src === 'manual' ? teethResultBox('teethResult') : `<p class="note">${t('teethNote')}</p>`}`;

// Shrinks a phone photo to at most `max` pixels on its longest side and re-encodes it as JPEG.
function shrinkImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', quality);
      resolve({dataUrl, base64: dataUrl.slice(dataUrl.indexOf(',') + 1)});
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

async function analyzeTeethPhoto(file) {
  const ctx = teethCtx; if (!ctx) return;
  let shot;
  try { shot = await shrinkImage(file, 1280, 0.85); }
  catch { ctx.ai = {status: 'error', error: 'image'}; renderTeeth('aiCard'); return; }
  ctx.ai = {status: 'busy', photo: shot.dataUrl};
  renderTeeth();
  let ai;
  try {
    const res = await fetch(HB_CONFIG.supabaseUrl.replace(/\/$/, '') + '/functions/v1/teeth-age', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', apikey: HB_CONFIG.supabaseKey, Authorization: 'Bearer ' + HB_CONFIG.supabaseKey},
      body: JSON.stringify({image: shot.base64, species: ctx.species, lang})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(['limit', 'busy', 'bad_image'].includes(data.error) ? data.error : 'ai');
    ai = {status: 'done', photo: shot.dataUrl, result: data};
  } catch (e) {
    ai = {status: 'error', photo: shot.dataUrl, error: navigator.onLine === false ? 'offline' : (e.message in {limit: 1, busy: 1, bad_image: 1} ? e.message : 'ai')};
  }
  if (teethCtx !== ctx) return; // the sheet was closed or reopened meanwhile
  ctx.ai = ai;
  if (ai.status === 'done' && ai.result.photo_ok && ai.result.stage !== 'unknown' && TEETH[ctx.species].stages.some(s => s[0] === ai.result.stage)) {
    ctx.stage = ai.result.stage; ctx.src = 'ai';
  }
  renderTeeth('aiCard');
}

  sheetDelete: () => sheetCtx?.onDelete?.(),
  setLang: ds => { lang = ds.v; db.lang = lang; save(); render(); },
  login: ds => { db.currentId = ds.id; save(); go('home'); },
  register: () => profileForm(null),
  demo: () => { seedDemo(); save(); render(); toast(t('demoLoaded')); },
  logout: () => { db.currentId = null; save(); render(); },
  editProfile: () => profileForm(me()),
  deleteAccount: () => openConfirm(t('deleteAccountQ', {name: me().name}), t('deleteAccountBtn'), () => {
    delete db.data[db.currentId]; db.farmers = db.farmers.filter(f => f.id !== db.currentId); db.currentId = null; toast(t('accountDeleted'));
  }),
  filterSpecies: ds => { state.species = ds.v; if (ds.nav) { state.status = 'Active'; state.q = ''; go('animals'); } else render(); },
  filterStatus: ds => { state.status = ds.v; render(); },
  addAnimal: () => animalForm(null),
  editAnimal: ds => animalForm(animal(ds.id)),
  deleteAnimal: ds => { const a = animal(ds.id); openConfirm(t('deleteAnimalQ', {name: aName(a)}), t('delete'), () => {
    const d = D(); d.animals = d.animals.filter(x => x.id !== a.id); d.health = d.health.filter(h => h.animalId !== a.id);
    d.production = d.production.filter(p => p.animalId !== a.id); state.view = 'animals'; toast(t('animalDeleted'));
  }); },
  addWeight: ds => { const a = animal(ds.id); openForm({title: t('weighTitle', {name: aName(a)}), values: {date: today()},
    fields: [{name: 'date', label: t('f_date'), type: 'date', required: true, half: true}, {name: 'kg', label: t('f_weightKg'), type: 'number', required: true, half: true}],
    onSubmit: v => { (a.weights = a.weights || []).push(v); toast(t('weightRecorded')); }}); },
  addHealth: ds => healthForm(null, ds.animal ? {animalId: ds.animal} : {}),
  editHealth: ds => healthForm(D().health.find(h => h.id === ds.id)),
  logDue: ds => { const h = D().health.find(x => x.id === ds.id);
    healthForm(null, {animalId: h.animalId, type: h.type, title: h.title, medicine: h.medicine, fromId: h.id}); },
  teeth: ds => openTeeth(ds.id),
  teethPick: ds => { teethCtx.stage = ds.v; teethCtx.src = 'manual'; renderTeeth('teethResult'); },
  teethPhoto: () => document.getElementById('teethPhotoFile').click(),
  teethSave: () => {
    const a = animal(teethCtx.animalId), s = TEETH[teethCtx.species].stages.find(x => x[0] === teethCtx.stage);
    if (!a || !s) return;
    const years = s[4] === null ? s[3] + 1 : (s[3] + s[4]) / 2; // middle of the range (a year past an open-ended minimum)
    const d = new Date(today() + 'T00:00'); d.setDate(d.getDate() - Math.round(years * 365.25));
    a.birth = iso(d); a.birthEst = true;
    save(); closeSheet(); render(); toast(t('estSaved'));
  },
  prodTab: ds => { state.prod = ds.v; render(); },
  openProd: ds => { state.prod = ds.k; go('production'); },
  addProd: ds => prodForm(ds.k, null, ds.animal ? {animalId: ds.animal} : {}),
  editProd: ds => prodForm(ds.k, (ds.k === 'Feed' ? D().feed : D().production).find(x => x.id === ds.id)),
  export: () => {
    const f = me();
    const blob = new Blob([JSON.stringify({app: 'HerdBook', version: 1, exportedAt: new Date().toISOString(), farmer: f, data: D()}, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `herdbook-${(f.farm.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'farm')}-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(t('backupDownloaded'));
  },
  import: () => document.getElementById('importFile').click()
};

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { const [v, p] = g.dataset.go.split(':'); go(v, p); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) { e.preventDefault(); ACTIONS[a.dataset.act](a.dataset, a); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; renderAnimalList(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'teethSpecies' && teethCtx) {
    Object.assign(teethCtx, {species: e.target.value, stage: null, src: null, ai: {status: 'idle'}});
    renderTeeth();
  }
  if (e.target.id === 'teethPhotoFile') {
    const file = e.target.files[0]; e.target.value = '';
    if (file) analyzeTeethPhoto(file);
  }
});
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  file.text().then(txt => {
    const j = JSON.parse(txt);
    if (!j || j.app !== 'HerdBook' || !j.data || !Array.isArray(j.data.animals)) throw new Error('bad');
    openConfirm(t('replaceQ', {name: me().name, date: fdate((j.exportedAt || '').slice(0, 10)), n: fmt(j.data.animals.length, 0)}), t('replace'), () => {
      db.data[db.currentId] = {animals: j.data.animals, health: j.data.health || [], production: j.data.production || [], feed: j.data.feed || []};
      toast(t('backupImported'));
    });
  }).catch(() => toast(t('notBackup')));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
